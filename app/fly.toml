# fly.toml app configuration file generated for ttb-label-recognition on 2026-06-09T21:40:07-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ttb-label-recognition'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  GROQ_MODEL = 'llama-3.1-8b-instant'
  MAX_BATCH_SIZE = '300'
  NODE_ENV = 'production'
  PORT = '3000'
  UPLOAD_DIR = '/data/uploads'
  WORKER_CONCURRENCY = '4'

[[mounts]]
  source = 'ttb_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 40
    soft_limit = 20

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'get'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-2x'
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 1024
